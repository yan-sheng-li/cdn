<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Vue 3 + Leaflet 移动端地图示例</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #app {
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
    }
    #map {
      flex: 1;
    }
    .buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 8px;
      background: rgba(240,240,240,0.9);
      border-bottom: 1px solid #ddd;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
    }
    .buttons button {
      flex: 1;
      min-width: 80px;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: white;
      cursor: pointer;
    }
    .buttons button:active {
      background: #eee;
    }
    /* 自定义定位按钮 */
    .locate-button {
      width: 44px;
      height: 44px;
      background: white;
      border: 2px solid #ccc;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      font-size: 20px;
    }
    .locate-button:hover {
      background: #f9f9f9;
    }
    /* 收藏侧滑面板 */
    .fav-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.4);
      z-index: 2000;
    }
    .fav-panel {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 80%;
      max-width: 300px;
      background: #fff;
      box-shadow: -2px 0 8px rgba(0,0,0,0.2);
      transform: translateX(100%);
      transition: transform 0.25s ease;
      z-index: 2001;
      display: flex;
      flex-direction: column;
    }
    .fav-panel.open {
      transform: translateX(0);
    }
    .fav-panel .fav-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid #eee;
      font-size: 16px;
      font-weight: bold;
    }
    .fav-panel .fav-head .close {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #888;
    }
    .fav-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .fav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
    }
    .fav-item:active {
      background: #f5f5f5;
    }
    .fav-item .info {
      flex: 1;
      min-width: 0;
    }
    .fav-item .name {
      font-size: 15px;
      color: #333;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .fav-item .coords {
      font-size: 12px;
      color: #999;
    }
    .fav-item .del {
      background: none;
      border: none;
      color: #e53935;
      font-size: 14px;
      cursor: pointer;
      padding: 4px 8px;
      margin-left: 8px;
      flex-shrink: 0;
    }
    .fav-empty {
      text-align: center;
      color: #999;
      padding: 40px 16px;
    }
  </style>
</head>
<body>
<div id="app">
  <div class="buttons">
    <button @click="changeBase('osm')">街道图</button>
    <button @click="changeBase('satellite')">卫星图</button>
    <button @click="addFavorite">⭐ 收藏</button>
    <button @click="togglePanel">📋 列表</button>
  </div>
  <div id="map"></div>

  <div class="fav-overlay" v-if="showPanel" @click="showPanel = false"></div>
  <aside class="fav-panel" :class="{ open: showPanel }">
    <div class="fav-head">
      <span>我的收藏</span>
      <button class="close" @click="showPanel = false">×</button>
    </div>
    <ul class="fav-list">
      <li class="fav-item" v-for="(item, index) in favorites" :key="index" @click="gotoFavorite(item)">
        <div class="info">
          <div class="name">{{ item.name }}</div>
          <div class="coords">{{ item.lat.toFixed(6) }}, {{ item.lng.toFixed(6) }}</div>
        </div>
        <button class="del" @click.stop="removeFavorite(index)">删除</button>
      </li>
    </ul>
    <p class="fav-empty" v-if="favorites.length === 0">暂无收藏</p>
  </aside>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
const { createApp, ref, onMounted } = Vue;

createApp({
  setup() {
    const map = ref(null);
    const baseLayers = {};
    const overlayLayers = {};
    let locationMarker = null;
    let locationCircle = null;
    const favorites = ref([]);
    const showPanel = ref(false);
    const STORAGE_KEY = 'mapFavorites';

    const saveFavorites = () => {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(favorites.value));
    };
    const addFavorite = () => {
      const c = map.value.getCenter();
      const name = prompt('请输入收藏名称', '位置' + (favorites.value.length + 1));
      if (name === null || name.trim() === '') return;
      favorites.value.push({ name: name.trim(), lat: c.lat, lng: c.lng, ts: Date.now() });
      saveFavorites();
      showPanel.value = true;
    };
    const gotoFavorite = (item) => {
      map.value.flyTo([item.lat, item.lng], 16);
      showPanel.value = false;
    };
    const removeFavorite = (index) => {
      favorites.value.splice(index, 1);
      saveFavorites();
    };
    const togglePanel = () => {
      showPanel.value = !showPanel.value;
    };

    onMounted(() => {
      // 初始化地图
      favorites.value = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      map.value = L.map('map', {
        center: [39.904200, 116.407400],
        zoom: 13,
        zoomControl: false
      });

      // 底图：街道图
      baseLayers.osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      });

      // 底图：卫星图
      baseLayers.satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri'
      });

      // 覆盖层：标注
      overlayLayers.labels = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        opacity: 0.5
      });

      // 默认加载街道图
      baseLayers.osm.addTo(map.value);

      // 基础控件
      L.control.zoom({ position: 'bottomright' }).addTo(map.value);
      L.control.scale({ position: 'bottomleft', metric: true }).addTo(map.value);
      L.control.layers(
        { "街道图": baseLayers.osm, "卫星图": baseLayers.satellite },
        { "标注": overlayLayers.labels },
        { position: 'topright' }
      ).addTo(map.value);

      // 定位控件
      const locateControl = L.control({ position: 'bottomright' });
      locateControl.onAdd = function () {
        const div = L.DomUtil.create('div', 'locate-button');
        div.innerHTML = "📍";
        div.title = "定位到我的位置";
        div.onclick = () => {
          map.value.locate({ setView: true, maxZoom: 16 });
        };
        return div;
      };
      locateControl.addTo(map.value);

      // 定位成功
      map.value.on("locationfound", (e) => {
        if (locationMarker) map.value.removeLayer(locationMarker);
        if (locationCircle) map.value.removeLayer(locationCircle);

        locationMarker = L.marker(e.latlng).addTo(map.value)
          .bindPopup("你在这里").openPopup();
        locationCircle = L.circle(e.latlng, { radius: e.accuracy, color: "#3388ff", fillColor: "#3388ff", fillOpacity: 0.1 }).addTo(map.value);
      });

      // 定位失败
      map.value.on("locationerror", (e) => {
        alert("定位失败：" + e.message);
      });
    });

    // 切换底图
    const changeBase = (type) => {
      Object.values(baseLayers).forEach(layer => map.value.removeLayer(layer));
      baseLayers[type].addTo(map.value);
    };

    return { changeBase, favorites, showPanel, addFavorite, gotoFavorite, removeFavorite, togglePanel };
  }
}).mount('#app');
</script>
</body>
</html>
