<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Vue 3 + Leaflet 移动端地图示例</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    #app {
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
    }
    #map {
      flex: 1;
    }
    .buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 8px;
      background: rgba(240,240,240,0.9);
      border-bottom: 1px solid #ddd;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
    }
    .buttons button {
      flex: 1;
      min-width: 80px;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: white;
      cursor: pointer;
    }
    .buttons button:active {
      background: #eee;
    }
    /* 自定义定位按钮 */
    .locate-button {
      width: 44px;
      height: 44px;
      background: white;
      border: 2px solid #ccc;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      font-size: 20px;
    }
    .locate-button:hover {
      background: #f9f9f9;
    }
    /* 收藏侧滑面板 */
    .fav-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.4);
      z-index: 2000;
    }
    .fav-panel {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 80%;
      max-width: 300px;
      background: #fff;
      box-shadow: -2px 0 8px rgba(0,0,0,0.2);
      transform: translateX(100%);
      transition: transform 0.25s ease;
      z-index: 2001;
      display: flex;
      flex-direction: column;
    }
    .fav-panel.open {
      transform: translateX(0);
    }
    .fav-panel .fav-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid #eee;
      font-size: 16px;
      font-weight: bold;
    }
    .fav-panel .fav-head .close {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #888;
    }
    .fav-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .fav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
    }
    .fav-item:active {
      background: #f5f5f5;
    }
    .fav-item .info {
      flex: 1;
      min-width: 0;
    }
    .fav-item .name {
      font-size: 15px;
      color: #333;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .fav-item .coords {
      font-size: 12px;
      color: #999;
    }
    .fav-item .del {
      background: none;
      border: none;
      color: #e53935;
      font-size: 14px;
      cursor: pointer;
      padding: 4px 8px;
      margin-left: 8px;
      flex-shrink: 0;
    }
    .fav-empty {
      text-align: center;
      color: #999;
      padding: 40px 16px;
    }
    /* 天气浮层 */
    .weather-panel {
      position: fixed;
      left: 12px;
      bottom: 70px;
      z-index: 1000;
      background: rgba(255,255,255,0.95);
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      padding: 10px 14px;
      font-size: 13px;
      color: #333;
      max-width: 200px;
      display: none;
    }
    .weather-panel.show {
      display: block;
    }
    .weather-panel .w-temp {
      font-size: 22px;
      font-weight: bold;
      color: #e53935;
    }
    .weather-panel .w-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }
    .weather-panel .w-desc {
      font-size: 14px;
    }
    .weather-panel .w-wind {
      font-size: 12px;
      color: #777;
    }
    /* 搜索面板 */
    .search-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.4);
      z-index: 2000;
    }
    .search-panel {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 80%;
      max-width: 300px;
      background: #fff;
      box-shadow: -2px 0 8px rgba(0,0,0,0.2);
      transform: translateX(100%);
      transition: transform 0.25s ease;
      z-index: 2001;
      display: flex;
      flex-direction: column;
    }
    .search-panel.open {
      transform: translateX(0);
    }
    .search-panel .search-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid #eee;
      font-size: 16px;
      font-weight: bold;
    }
    .search-panel .search-head .close {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #888;
    }
    .search-input-row {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid #f0f0f0;
    }
    .search-input-row input {
      flex: 1;
      min-width: 0;
      padding: 8px 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
    }
    .search-input-row input:focus {
      border-color: #3388ff;
    }
    .search-input-row button {
      padding: 8px 14px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: white;
      cursor: pointer;
      flex-shrink: 0;
    }
    .search-input-row button:active {
      background: #eee;
    }
    .search-result-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
    }
    .search-result-item:active {
      background: #f5f5f5;
    }
    .search-result-item .info {
      flex: 1;
      min-width: 0;
    }
    .search-result-item .name {
      font-size: 15px;
      color: #333;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .search-result-item .addr {
      font-size: 12px;
      color: #999;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .search-result-item .fav-add {
      background: none;
      border: 1px solid #ccc;
      border-radius: 6px;
      color: #3388ff;
      font-size: 13px;
      cursor: pointer;
      padding: 4px 10px;
      margin-left: 8px;
      flex-shrink: 0;
    }
    .search-empty {
      text-align: center;
      color: #999;
      padding: 40px 16px;
    }
  </style>
</head>
<body>
<div id="app">
  <div class="buttons">
    <button @click="changeBase('osm')">街道图</button>
    <button @click="changeBase('satellite')">卫星图</button>
    <button @click="addFavorite">⭐ 收藏</button>
    <button @click="togglePanel">📋 列表</button>
    <button @click="openSearch">🔍 搜索</button>
  </div>
  <div id="map"></div>
  <div class="weather-panel" id="weatherPanel">
    <div class="w-row"><span class="w-temp" id="wTemp">--°</span><span class="w-desc" id="wDesc">--</span></div>
    <div class="w-wind" id="wWind">风速：-- km/h</div>
  </div>

  <div class="fav-overlay" v-if="showPanel" @click="showPanel = false"></div>
  <aside class="fav-panel" :class="{ open: showPanel }">
    <div class="fav-head">
      <span>我的收藏</span>
      <button class="close" @click="showPanel = false">×</button>
    </div>
    <ul class="fav-list">
      <li class="fav-item" v-for="(item, index) in favorites" :key="index" @click="gotoFavorite(item)">
        <div class="info">
          <div class="name">{{ item.name }}</div>
          <div class="coords">{{ item.lat.toFixed(6) }}, {{ item.lng.toFixed(6) }}</div>
        </div>
        <button class="del" @click.stop="removeFavorite(index)">删除</button>
      </li>
    </ul>
    <p class="fav-empty" v-if="favorites.length === 0">暂无收藏</p>
  </aside>

  <div class="search-overlay" v-if="showSearch" @click="showSearch = false"></div>
  <aside class="search-panel" :class="{ open: showSearch }">
    <div class="search-head">
      <span>搜索地点</span>
      <button class="close" @click="showSearch = false">×</button>
    </div>
    <div class="search-input-row">
      <input v-model="searchKeyword" placeholder="输入关键词，如：天安门" @keyup.enter="searchPlaces" />
      <button @click="searchPlaces">搜索</button>
    </div>
    <ul class="fav-list">
      <li class="search-result-item" v-for="(item, index) in searchResults" :key="index" @click="gotoSearchResult(item)">
        <div class="info">
          <div class="name">{{ item.display_name.split(',')[0] }}</div>
          <div class="addr">{{ item.display_name }}</div>
        </div>
        <button class="fav-add" @click.stop="favoriteFromResult(item)">收藏</button>
      </li>
    </ul>
    <p class="search-empty" v-if="searchResults.length === 0">输入关键词搜索地点</p>
  </aside>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
const { createApp, ref, onMounted } = Vue;

createApp({
  setup() {
    const map = ref(null);
    const baseLayers = {};
    const overlayLayers = {};
    let locationMarker = null;
    let locationCircle = null;
    const favorites = ref([]);
    const showPanel = ref(false);
    const showSearch = ref(false);
    const searchKeyword = ref('');
    const searchResults = ref([]);
    let searchMarker = null;
    const STORAGE_KEY = 'mapFavorites';

    const saveFavorites = () => {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(favorites.value));
    };
    const addFavorite = () => {
      const c = map.value.getCenter();
      const name = prompt('请输入收藏名称', '位置' + (favorites.value.length + 1));
      if (name === null || name.trim() === '') return;
      favorites.value.push({ name: name.trim(), lat: c.lat, lng: c.lng, ts: Date.now() });
      saveFavorites();
      showPanel.value = true;
    };
    const gotoFavorite = (item) => {
      map.value.flyTo([item.lat, item.lng], 16);
      showPanel.value = false;
    };
    const removeFavorite = (index) => {
      favorites.value.splice(index, 1);
      saveFavorites();
    };
    const togglePanel = () => {
      showPanel.value = !showPanel.value;
    };

    // ============ 地点搜索 ============
    const openSearch = () => {
      showSearch.value = true;
    };
    const searchPlaces = async () => {
      const q = searchKeyword.value.trim();
      if (!q) return;
      try {
        const res = await fetch(
          `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=6&accept-language=zh`
        );
        searchResults.value = await res.json();
      } catch (err) {
        console.warn('搜索失败', err);
        searchResults.value = [];
      }
    };
    const gotoSearchResult = (item) => {
      const lat = parseFloat(item.lat);
      const lng = parseFloat(item.lon);
      if (searchMarker) map.value.removeLayer(searchMarker);
      searchMarker = L.marker([lat, lng]).addTo(map.value)
        .bindPopup(item.display_name.split(',')[0]).openPopup();
      map.value.flyTo([lat, lng], 16);
      showSearch.value = false;
    };
    const favoriteFromResult = (item) => {
      const name = prompt('请输入收藏名称', item.display_name.split(',')[0]);
      if (name === null || name.trim() === '') return;
      favorites.value.push({ name: name.trim(), lat: parseFloat(item.lat), lng: parseFloat(item.lon), ts: Date.now() });
      saveFavorites();
      alert('已收藏');
    };

    // ============ 天气 ============
    const WMO_CODES = {
      0: '晴', 1: '大致晴朗', 2: '多云', 3: '阴天',
      45: '雾', 48: '冻雾', 51: '毛毛雨', 53: '小毛毛雨', 55: '毛毛雨',
      61: '小雨', 63: '中雨', 65: '大雨', 66: '冻雨', 67: '强冻雨',
      71: '小雪', 73: '中雪', 75: '大雪', 77: '雪粒',
      80: '小阵雨', 81: '中阵雨', 82: '强阵雨',
      85: '小阵雪', 86: '大阵雪', 95: '雷暴', 96: '雷暴伴冰雹', 99: '强雷暴伴冰雹'
    };
    const wPanel = () => document.getElementById('weatherPanel');
    const fetchWeather = async (lat, lng) => {
      try {
        const res = await fetch(
          `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true&timezone=Asia%2FShanghai`
        );
        const data = await res.json();
        const w = data.current_weather;
        if (!w) return;
        document.getElementById('wTemp').textContent = Math.round(w.temperature) + '°C';
        document.getElementById('wDesc').textContent = WMO_CODES[w.weathercode] || '未知';
        document.getElementById('wWind').textContent = '风速：' + w.windspeed + ' km/h';
        wPanel().classList.add('show');
      } catch (err) {
        console.warn('天气获取失败', err);
      }
    };
    const refreshWeather = () => {
      const c = map.value.getCenter();
      fetchWeather(c.lat, c.lng);
    };
    let weatherTimer = null;

    onMounted(() => {
      // 初始化地图
      favorites.value = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      map.value = L.map('map', {
        center: [39.904200, 116.407400],
        zoom: 13,
        zoomControl: false
      });

      // 底图：街道图
      baseLayers.osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      });

      // 底图：卫星图
      baseLayers.satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri'
      });

      // 覆盖层：标注
      overlayLayers.labels = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        opacity: 0.5
      });

      // 默认加载街道图
      baseLayers.osm.addTo(map.value);

      // 基础控件
      L.control.zoom({ position: 'bottomright' }).addTo(map.value);
      L.control.scale({ position: 'bottomleft', metric: true }).addTo(map.value);
      L.control.layers(
        { "街道图": baseLayers.osm, "卫星图": baseLayers.satellite },
        { "标注": overlayLayers.labels },
        { position: 'topright' }
      ).addTo(map.value);

      // 定位控件
      const locateControl = L.control({ position: 'bottomright' });
      locateControl.onAdd = function () {
        const div = L.DomUtil.create('div', 'locate-button');
        div.innerHTML = "📍";
        div.title = "定位到我的位置";
        div.onclick = () => {
          map.value.locate({ setView: true, maxZoom: 16 });
        };
        return div;
      };
      locateControl.addTo(map.value);

      // 定位成功
      map.value.on("locationfound", (e) => {
        if (locationMarker) map.value.removeLayer(locationMarker);
        if (locationCircle) map.value.removeLayer(locationCircle);

        locationMarker = L.marker(e.latlng).addTo(map.value)
          .bindPopup("你在这里").openPopup();
        locationCircle = L.circle(e.latlng, { radius: e.accuracy, color: "#3388ff", fillColor: "#3388ff", fillOpacity: 0.1 }).addTo(map.value);
        fetchWeather(e.latlng.lat, e.latlng.lng);
      });

      // 定位失败
      map.value.on("locationerror", (e) => {
        alert("定位失败：" + e.message);
      });

      // 地图中心移动时刷新天气（防抖）
      map.value.on("moveend", () => {
        clearTimeout(weatherTimer);
        weatherTimer = setTimeout(refreshWeather, 800);
      });

      // 初始加载一次天气
      refreshWeather();
    });

    // 切换底图
    const changeBase = (type) => {
      Object.values(baseLayers).forEach(layer => map.value.removeLayer(layer));
      baseLayers[type].addTo(map.value);
    };

    return { changeBase, favorites, showPanel, addFavorite, gotoFavorite, removeFavorite, togglePanel, showSearch, searchKeyword, searchResults, openSearch, searchPlaces, gotoSearchResult, favoriteFromResult };
  }
}).mount('#app');
</script>
</body>
</html>
